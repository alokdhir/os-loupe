name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install cryptography
      - name: rule files are formatted
        run: python tools/fmtjson.py src/opnsense/scripts/loupe/data/*.json && git diff --exit-code
      - name: unit tests (incl. every rule's example)
        working-directory: tests
        run: python -m unittest test_tls test_quic test_pfstate test_store test_devid test_services test_rules
