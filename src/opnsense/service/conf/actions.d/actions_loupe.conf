[start]
command:/usr/local/etc/rc.d/loupe start
type:script
message:starting loupe

[stop]
command:/usr/local/etc/rc.d/loupe onestop
errors:no
type:script
message:stopping loupe

[restart]
command:/usr/local/etc/rc.d/loupe restart
type:script
message:restarting loupe
description:Restart Loupe traffic monitor

[status]
command:/usr/local/etc/rc.d/loupe status; exit 0
type:script_output
message:loupe status

[query]
command:/usr/local/opnsense/scripts/loupe/query.py
parameters:%s %s %s %s %s
type:script_output
message:loupe query %s
